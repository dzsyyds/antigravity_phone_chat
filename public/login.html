<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08090e">
    <title>Antigravity 掌上控制台 - 登录</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <style>
        :root {
            --bg: #08090e;
            --surface: #11131d;
            --surface-border: rgba(255, 255, 255, 0.09);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.28);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 55%, #3b82f6 100%);
            --text: #f8fafc;
            --text-muted: #7e8a9f;
            --text-subtle: #a3b0c4;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 18%, rgba(79, 70, 229, 0.16) 0%, #08090e 58%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Plus Jakarta Sans", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 轻量背景光晕 */
        body::before {
            content: '';
            position: absolute;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, rgba(59, 130, 246, 0.05) 52%, transparent 72%);
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .login-card {
            background: var(--surface);
            padding: 2.25rem 1.75rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 372px;
            text-align: center;
            border: 1px solid var(--surface-border);
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-badge {
            width: 60px;
            height: 60px;
            margin: 0 auto 1.25rem;
            border-radius: 1.1rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(59, 130, 246, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.25);
        }

        .logo-badge svg {
            width: 30px;
            height: 30px;
            color: #818cf8;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 0.4rem 0;
            background: linear-gradient(135deg, #ffffff 0%, #d4d4d8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-subtle);
            font-size: 0.92rem;
            margin: 0 0 2rem 0;
            line-height: 1.4;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1rem;
            color: #fff;
            outline: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 1rem;
            text-align: center;
            letter-spacing: 0.15em;
            font-family: 'JetBrains Mono', monospace;
        }

        input::placeholder {
            color: #52525b;
            letter-spacing: 0;
            font-family: inherit;
            font-size: 0.92rem;
        }

        input:focus {
            border-color: #6366f1;
            background: rgba(39, 39, 42, 0.9);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:active {
            transform: scale(0.98);
            filter: brightness(0.95);
        }

        .error {
            color: #f87171;
            font-size: 0.88rem;
            margin-top: 1rem;
            display: none;
            padding: 0.7rem;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 0.75rem;
        }

        .footer-note {
            margin-top: 1.75rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
        </div>
        <h1>Antigravity</h1>
        <p class="subtitle">安全连接电脑端 AI 智能体</p>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="请输入访问口令" autofocus>
        </div>
        
        <button id="loginBtn">
            <span>安全连接</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
        
        <div class="error" id="error">口令错误，请重新输入</div>

        <div class="footer-note">
            <span class="status-dot"></span>
            <span>端到端加密中继 · 校园网与 5G 全域通用</span>
        </div>
    </div>

    <script>
        const btn = document.getElementById('loginBtn');
        const input = document.getElementById('password');
        const error = document.getElementById('error');

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('err') === 'pair_expired') {
            error.textContent = '配对二维码已过期或已失效，请重新扫码或输入访问口令';
            error.style.display = 'block';
        }

        async function doLogin() {
            const password = input.value;
            if (!password) {
                input.focus();
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>正在验证...</span>';
            error.style.display = 'none';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    btn.innerHTML = '<span>验证成功 ➔</span>';
                    window.location.href = '/';
                } else {
                    error.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<span>安全连接</span>';
                    input.select();
                }
            } catch (e) {
                error.textContent = '网络连接失败，请确认后台服务正常运行';
                error.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<span>安全连接</span>';
            }
        }

        btn.onclick = doLogin;
        input.onkeypress = (e) => {
            if (e.key === 'Enter') doLogin();
        };
    </script>
</body>

</html>
